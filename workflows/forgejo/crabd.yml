# crab'd for Forgejo Actions.
# Copy to `.forgejo/workflows/crabd.yml` in your repo.
#
# Rolling this out across several repos? See `crabd-reusable.yml` next to this file.
#
# Identity: Forgejo has no GitHub App equivalent, so crab'd acts as whatever bot
# account owns CRABD_FORGEJO_TOKEN. Create a dedicated bot user, give it repo access,
# and store its token as the CRABD_FORGEJO_TOKEN secret — its name/avatar become crab'd.
name: crab'd
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [assigned, labeled]

jobs:
  crabd:
    runs-on: docker
    steps:
      # `ref:` matters: crab'd reviews the pull request's HEAD commit, and neither event gives you
      # that by default. On `issue_comment` the default SHA is the base branch; on `pull_request`
      # it's the merge ref, whose sha is not the PR head. Check out the head explicitly so the files
      # on disk are exactly what the diff describes. crab'd also self-corrects at runtime when it can.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || '' }}
          fetch-depth: 0
      - uses: https://github.com/louisescher/crabd@v0
        with:
          forge: forgejo
          model: anthropic/claude-sonnet-4-6
          providers: anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRABD_FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          CRABD_FORGEJO_TOKEN: ${{ secrets.CRABD_FORGEJO_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}  # if using sandbox.npmrc — name must match token_env
