# crab'd for GitHub Actions.
# Copy to `.github/workflows/crabd.yml` in your repo.
#
# Identity: by default crab'd authenticates as the canonical crab'd[bot] via the
# token broker. That needs `id-token: write` (for OIDC) and the crab'd GitHub App
# installed on the repo — no secrets to manage for identity.
#
# To run your OWN branded App instead, drop `id-token: write`, remove broker-url,
# and pass `app-id` / `app-private-key` (see app/README.md).
name: crab'd
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [assigned, labeled]
  # A submitted review, or a single inline comment, on a pull request crab'd opened starts a
  # feedback round: it answers every open conversation and commits onto the branch.
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

# One crab'd run at a time per issue or pull request. A submitted review arrives as several events
# at once (the review, plus one per inline comment), and two runs committing to the same branch is
# how you lose work. Queue rather than cancel: a cancelled round abandons a commit it already made.
concurrency:
  group: crabd-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  crabd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      checks: read # the failing checks a feedback round reads
      actions: read # and the job logs behind them
    steps:
      # `ref:` matters: crab'd reviews the pull request's HEAD commit, and neither event gives you
      # that by default. On `issue_comment` the default SHA is the base branch; on `pull_request`
      # it's the merge commit, whose sha is not the PR head. Check out the head explicitly so the
      # files on disk are exactly what the diff describes. (crab'd self-corrects at runtime when it
      # can, and tells the model when it can't, but starting on the right commit is cheaper.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || '' }}
          fetch-depth: 0
      - uses: louisescher/crabd@v0
        with:
          model: anthropic/claude-sonnet-4-6
          providers: anthropic
          # broker-url: https://crabd-broker.example.com  # set if self-hosting the broker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}  # if using sandbox.npmrc — name must match token_env
