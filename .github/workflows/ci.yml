name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # Consumers resolve @crabd/config and @crabd/core to their built dist/*.d.ts,
      # so the libraries must be built before typecheck/test. (action/broker don't
      # need pre-building; docs is excluded entirely.)
      - name: Build libraries
        run: pnpm --filter @crabd/config --filter @crabd/core run build

      - name: Typecheck
        run: >-
          pnpm --filter @crabd/config --filter @crabd/core
          --filter @crabd/action --filter @crabd/broker run typecheck

      - name: Test
        run: >-
          pnpm --filter @crabd/config --filter @crabd/core
          --filter @crabd/action --filter @crabd/broker run test
